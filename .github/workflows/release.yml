name: Installeur Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Construire l'exécutable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/make_icon.py
          python -m PyInstaller --noconfirm --clean SpoolManager.spec

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compiler l'installeur
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe introuvable" }
          $out = Join-Path $env:TEMP "spoolmanager-installer"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc "/DOutputDirOverride=$out" installer\spoolmanager.iss
          New-Item -ItemType Directory -Force -Path installer\output | Out-Null
          Copy-Item (Join-Path $out "*.exe") installer\output -Force

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: SpoolManager-Setup
          path: installer/output/*.exe

      - name: Joindre à la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
          generate_release_notes: true
